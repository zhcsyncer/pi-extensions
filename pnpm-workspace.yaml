packages:
  - "."
  - "packages/*"
  - "providers/*"

linkWorkspacePackages: true

overrides:
  "@earendil-works/pi-coding-agent@0.80.3>@earendil-works/pi-agent-core": 0.80.3
  "@earendil-works/pi-coding-agent@0.80.3>@earendil-works/pi-ai": 0.80.3
  "@earendil-works/pi-coding-agent@0.80.3>@earendil-works/pi-tui": 0.80.3

# Pi 0.85's root export imports experimental/server.js but omits this dependency.
packageExtensions:
  '@earendil-works/pi-coding-agent@0.85.0':
    dependencies:
      '@earendil-works/pi-server': 0.85.0

allowBuilds:
  "@bufbuild/buf": true
  "@google/genai": false
  esbuild: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.84.0 || 0.85.0'
  - '@earendil-works/pi-ai@0.84.0 || 0.85.0'
  - '@earendil-works/pi-client@0.84.0 || 0.85.0'
  - '@earendil-works/pi-coding-agent@0.84.0 || 0.85.0'
  - '@earendil-works/pi-protocol@0.84.0 || 0.85.0'
  - '@earendil-works/pi-telemetry@0.84.0 || 0.85.0'
  - '@earendil-works/pi-tui@0.84.0 || 0.85.0'
  - '@earendil-works/chord@0.85.0'
  - '@earendil-works/pi-server@0.85.0'
